# Netlify config for the Council of Experts public site.
#
# The site is the Paper-Hardening Cell Ledger: every cell in the research
# notebook in plain language, plus the claims page, glossary, the harness and
# the saved run data. It is pre-built into ./site_v3 and committed, so there is
# no build step on Netlify. Regenerate locally with:
#
#     .venv/bin/python docs/ledger_explorer/build.py
#
# then commit the updated site_v3/ directory. The previous sites are kept in
# archive/sites/ (site/ was the live site until 2026-09-24; site_v2/ was a
# local draft that was never deployed).

[build]
  publish = "site_v3"
  command = ""

# BUILDS RESUMED FOR ONE DEPLOY (2026-10-05): the pause that had been in
# place since 2026-09-24 is lifted in this commit so that the site with the
# October 2026 corrections and the results of Cells 62 to 67 is published.
# The pause is restored in the next commit. To pause, add:
#
#     [build.ignore]
#       command = "exit 0"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
