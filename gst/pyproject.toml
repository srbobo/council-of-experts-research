[project]
name = "gst-kit"
version = "0.1.0"
description = "Measurement kit and interventions for epistemic distortion at the writing step of lead-council LLM architectures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Bobo" }]
keywords = ["llm", "multi-agent", "evaluation", "epistemic", "provenance", "aggregation"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

# The core has NO dependencies. This is a design constraint, not an accident:
# an external replication should never be blocked from running the
# measurements by an environment problem, and every estimator here is small
# enough to implement exactly in the standard library.
dependencies = []

[project.optional-dependencies]
# Second instrument. Required before reporting any verdict -- see the
# two-instrument rule in gst.instruments.
nli = [
  "torch>=2.0",
  "transformers>=4.40",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
gst = "gst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gst"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
